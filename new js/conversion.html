<!DOCTYPE html>
<html>
    <body>
        <h2>Map Function</h2>
        
        <p>The map() method creates a new array with the results of calling a function for every array element.
        </p>

        <p id="number_result"></p>
        <p id="string_result"></p>

        <script>
            var x = 70;
            var y = 90;

            document.getElementById("number_result").innerHTML = "The sum of x and y is: " + (x + y);

            document.getElementById("string_result").innerHTML = "The concatenation of x and y is: " + (x.toString() + y.toString());
        </script>
    </body>
</html>
